app = "mezon-backend"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"

# The Mezon bot holds a long-lived socket, so a stopped machine means the bot
# is offline until the next request wakes it. Keep exactly one machine alive.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"