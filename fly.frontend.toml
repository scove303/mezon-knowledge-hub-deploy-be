app = "mezon-frontend"
primary_region = "sin"

[build]
  dockerfile = "frontend/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

# Stateless Next.js server: keep one machine up so first paint never waits on
# a cold start.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "npm start"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"