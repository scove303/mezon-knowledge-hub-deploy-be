[[services]]
name = "backend"
source = "."
dockerfilePath = "backend/Dockerfile"

[services.build]
builder = "dockerfile"

[services.deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[[services]]
name = "frontend"
source = "."
dockerfilePath = "frontend/Dockerfile"

[services.build]
builder = "dockerfile"

[services.deploy]
startCommand = "npm start"

[[databases]]
name = "mysql"
type = "mysql"