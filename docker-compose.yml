

services:
  database:
    image: mysql:8.0
    container_name: mezon_khb_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: mezon_knowledge_hub
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  bot-service:
    build: ./backend
    container_name: mezon_khb_bot
    depends_on:
      database:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=mezon_knowledge_hub
    ports:
      - "8000:8000"
    restart: always

  web-dashboard:
    build: ./frontend
    container_name: mezon_khb_dashboard
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://root:${DB_PASSWORD}@database:3306/mezon_knowledge_hub
    restart: always

volumes:
  mysql_data: